name: "Passo 2: 🚀 Aplicar GitHub na Produção (Finanças)"

on:
  workflow_dispatch: # Botão manual no GitHub Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Instalar Supabase CLI no servidor
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Injetar Atualizações no Banco Oficial
        run: |
          echo "Sincronizando histórico inicial (Baseline)..."
          supabase migration repair --status applied 20260918181341 --db-url "${{ secrets.PROD_DB_URL }}" || true
          supabase migration repair --status applied 20260918184209 --db-url "${{ secrets.PROD_DB_URL }}" || true
          
          echo "Conectando no lastro-financas e enviando mudanças novas..."
          supabase db push --db-url "${{ secrets.PROD_DB_URL }}"
          echo "✅ Banco Oficial atualizado com sucesso!"
