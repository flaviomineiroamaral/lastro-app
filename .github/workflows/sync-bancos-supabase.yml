name: "Passo 1: 📦 Extrair Homologação para GitHub"

on:
  workflow_dispatch: # Adiciona um botão no GitHub para rodar manualmente

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Instalar Supabase CLI no servidor do GitHub
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Corrigir Historico Fantasma do Banco
        run: |
          echo "Limpando historico de arquivos deletados..."
          supabase migration repair --status reverted 20260721121500 --db-url "${{ secrets.STAGING_DB_URL }}" || true
          supabase migration repair --status reverted 20260803000000 --db-url "${{ secrets.STAGING_DB_URL }}" || true
          supabase migration repair --status reverted 20260803000001 --db-url "${{ secrets.STAGING_DB_URL }}" || true
          supabase migration repair --status reverted 20260804113843 --db-url "${{ secrets.STAGING_DB_URL }}" || true
          supabase migration repair --status reverted 20260805004920 --db-url "${{ secrets.STAGING_DB_URL }}" || true
          supabase migration repair --status reverted 20260918180702 --db-url "${{ secrets.STAGING_DB_URL }}" || true

      - name: Extrair Arquivo de Migração (Sem pesar sua máquina)
        run: |
          supabase db pull --db-url "${{ secrets.STAGING_DB_URL }}"
          
      - name: Salvar e Enviar Código
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add supabase/migrations/
          
          # Verifica se o Supabase CLI gerou algum arquivo novo
          if git diff-index --quiet HEAD; then
            echo "O banco já está sincronizado. Nenhuma alteração detectada."
          else
            git commit -m "chore(db): Sincronizando tabelas do homologacao via Action"
            git push
          fi
