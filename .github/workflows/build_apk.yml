name: 📱 Gerar Aplicativo Android (APK)

on:
  push:
    branches: [ "main", "flutterflow" ]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Qual branch compilar?'
        required: true
        default: 'flutterflow'
        type: choice
        options:
          - flutterflow
          - main
      build_mode:
        description: 'Modo de Compilacao'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build_android:
    name: Compilar APK na Nuvem
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do Codigo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name || 'flutterflow' }}

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar Dependencias
        run: flutter pub get

      - name: Gerar Icones e Splash Screen Nativos
        run: |
          echo "Gerando icones do aplicativo personalizados..."
          dart run flutter_launcher_icons
          
          echo "Gerando tela de splash nativa..."
          dart run flutter_native_splash:create

      - name: Compilar APK Android e Renomear
        run: |
          BUILD_MODE="${{ github.event.inputs.build_mode || 'release' }}"
          echo "Compilando em modo: $BUILD_MODE da branch: ${{ github.event.inputs.branch || github.ref_name || 'flutterflow' }}"
          flutter build apk --$BUILD_MODE
          
          echo "Renomeando o arquivo gerado para Lastro.apk..."
          mv build/app/outputs/flutter-apk/app-$BUILD_MODE.apk build/app/outputs/flutter-apk/Lastro.apk

      - name: Disponibilizar APK para Download (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: Lastro-App-${{ github.event.inputs.branch || 'flutterflow' }}-${{ github.event.inputs.build_mode || 'release' }}
          path: build/app/outputs/flutter-apk/Lastro.apk
          if-no-files-found: error
          retention-days: 7

      - name: Atualizar APK no GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.0
          name: "Lastro App - Última Versão (FlutterFlow)"
          files: build/app/outputs/flutter-apk/Lastro.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
