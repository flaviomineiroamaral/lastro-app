name: 📱 Gerar Aplicativo Android (APK e Google Play AAB)

on:
  push:
    branches: [ "flutterflow" ]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Qual branch compilar?'
        required: true
        default: 'flutterflow'
        type: choice
        options:
          - flutterflow
          - main
      build_mode:
        description: 'Modo de Compilacao'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      supabase_env:
        description: 'Ambiente do Banco Supabase'
        required: true
        default: 'producao'
        type: choice
        options:
          - producao
          - homologacao

jobs:
  build_android:
    name: Compilar APK e AAB (Google Play) na Nuvem
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do Codigo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || (github.ref_name != 'main' && github.ref_name) || 'flutterflow' }}

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configurar Assinatura Oficial (Google Play Keystore)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n" "$ANDROID_STORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" > android/key.properties
            sed -i 's/signingConfig signingConfigs.debug/signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug/g' android/app/build.gradle
            echo "✅ Chave de assinatura oficial configurada!"
          else
            echo "ℹ️ Secrets de assinatura não encontrados. Usando configuração padrão."
          fi

      - name: Instalar Dependencias
        run: flutter pub get

      - name: Gerar Icones e Splash Screen Nativos
        run: |
          echo "Gerando icones do aplicativo personalizados..."
          dart run flutter_launcher_icons
          
          echo "Gerando tela de splash nativa..."
          dart run flutter_native_splash:create

      - name: Compilar APK e AAB (Google Play)
        run: |
          BUILD_MODE="${{ github.event.inputs.build_mode || 'release' }}"
          SUPABASE_ENV="${{ github.event.inputs.supabase_env || 'producao' }}"
          echo "Compilando em modo: $BUILD_MODE | Banco: $SUPABASE_ENV | Branch: ${{ github.event.inputs.branch || (github.ref_name != 'main' && github.ref_name) || 'flutterflow' }}"
          
          flutter build apk --$BUILD_MODE --dart-define=SUPABASE_ENV=$SUPABASE_ENV
          mv build/app/outputs/flutter-apk/app-$BUILD_MODE.apk build/app/outputs/flutter-apk/Lastro.apk
          
          if [ "$BUILD_MODE" = "release" ]; then
            echo "Gerando pacote .aab oficial para a Google Play Store..."
            flutter build appbundle --release --dart-define=SUPABASE_ENV=$SUPABASE_ENV
            cp build/app/outputs/bundle/release/app-release.aab build/app/outputs/flutter-apk/Lastro.aab
          fi

      - name: Disponibilizar APK e AAB para Download (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: Lastro-App-${{ github.event.inputs.branch || 'flutterflow' }}-${{ github.event.inputs.build_mode || 'release' }}
          path: |
            build/app/outputs/flutter-apk/Lastro.apk
            build/app/outputs/flutter-apk/Lastro.aab
          if-no-files-found: error
          retention-days: 14

      - name: Atualizar APK e AAB no GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.0
          name: "Lastro App - Última Versão Oficial (APK + Google Play AAB)"
          files: |
            build/app/outputs/flutter-apk/Lastro.apk
            build/app/outputs/flutter-apk/Lastro.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
